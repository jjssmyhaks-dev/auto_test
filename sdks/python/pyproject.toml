[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "veriflow"
version = "0.1.0"
description = "Official Python client for the Veriflow cloud API — submit agent browser-test runs and read results programmatically."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Veriflow" }]
keywords = ["browser-testing", "e2e", "testing", "agent", "playwright"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Testing",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["veriflow"]

[tool.pytest.ini_options]
testpaths = ["tests"]
